services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-osai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ./apps/control-plane-python
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-osai}
    ports:
      - "${CONTROL_PLANE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard-nextjs
    environment:
      CONTROL_PLANE_API_BASE_URL: http://control-plane:8000
      CONTROL_PLANE_APPROVER: ${CONTROL_PLANE_APPROVER:-dashboard-operator}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped

  execution-worker:
    build:
      context: ./apps/execution-go
    profiles: ["worker"]
    environment:
      EXECUTION_DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-osai}?sslmode=disable
      EXECUTION_JIRA_BASE_URL: ${EXECUTION_JIRA_BASE_URL:-}
      EXECUTION_JIRA_EMAIL: ${EXECUTION_JIRA_EMAIL:-}
      EXECUTION_JIRA_API_TOKEN: ${EXECUTION_JIRA_API_TOKEN:-}
      EXECUTION_JIRA_BEARER_TOKEN: ${EXECUTION_JIRA_BEARER_TOKEN:-}
      EXECUTION_REPO_SOURCE: /workspace
      EXECUTION_ARTIFACT_ROOT: /workspace/artifacts/execution-go
      EXECUTION_WORKSPACE_ROOT: /tmp/execution-go-workspaces
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
